name: Apply icon sizing update

on:
  push:
    paths:
      - '.github/workflows/icon-size-adjust.yml'

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update desktop icon sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/neversoft/launcher/desktop/Desktop.kt')
          s = p.read_text()
          old = 'private val ICON_SIZE_FRACTIONS = listOf(0.0625f, 0.171875f, 0.28125f, 0.390625f, 0.5f)'
          new = 'private val ICON_SIZE_FRACTIONS = listOf(0.03125f, 0.0859375f, 0.140625f, 0.1953125f, 0.25f)'
          if old not in s:
              raise SystemExit('Expected icon size fractions were not found')
          s = s.replace(old, new, 1)
          s = s.replace('var configOpen by remember { mutableStateOf(false) }', 'var configOpen by remember { mutableStateOf(false) }\n    var allSizeChooser by remember { mutableStateOf(false) }', 1)
          s = s.replace('''    fun setSize(item: DeskItem, level: Int) {
        val clamped = level.coerceIn(1, ICON_SIZE_COUNT)
        persistItems(items.map { if (it.id == item.id) it.copy(size = clamped) else it })
    }
''', '''    fun setSize(item: DeskItem, level: Int) {
        val clamped = level.coerceIn(1, ICON_SIZE_COUNT)
        persistItems(items.map { if (it.id == item.id) it.copy(size = clamped) else it })
    }

    fun setAllSizes(level: Int) {
        val clamped = level.coerceIn(1, ICON_SIZE_COUNT)
        persistItems(items.map { it.copy(size = clamped) })
    }
''', 1)
          s = s.replace('''                    DesktopMenuItem(Icons.Outlined.Tune, "Config & permissions") {
                        desktopMenuAt = null
                        configOpen = true
                    }
''', '''                    DesktopMenuItem(Icons.Outlined.Tune, "Config & permissions") {
                        desktopMenuAt = null
                        configOpen = true
                    }
                    DesktopMenuItem(Icons.Outlined.PhotoSizeSelectLarge, "Size all icons") {
                        desktopMenuAt = null
                        allSizeChooser = true
                    }
''', 1)
          marker = '''    // Rename dialog for desktop folders and shortcut labels
'''
          dialog = '''    // Global icon-size picker. Individual icon sizing remains available from each icon's menu.
    if (allSizeChooser) {
        Dialog(onDismissRequest = { allSizeChooser = false }) {
            Column(
                Modifier
                    .width(300.dp)
                    .clip(RoundedCornerShape(10.dp))
                    .background(theme.windowSurface)
                    .border(1.dp, theme.stroke, RoundedCornerShape(10.dp))
                    .padding(18.dp),
            ) {
                Text("Size all icons", color = theme.text, fontSize = 16.sp)
                Spacer(Modifier.height(4.dp))
                Text(
                    "Apply one size to every icon on this desktop",
                    color = theme.textSecondary, fontSize = 11.sp,
                )
                Spacer(Modifier.height(10.dp))
                for (level in 1..ICON_SIZE_COUNT) {
                    val label = when (level) {
                        1 -> "1 — smallest"
                        ICON_SIZE_COUNT -> "$level — largest"
                        else -> level.toString()
                    }
                    Row(
                        Modifier
                            .fillMaxWidth()
                            .clip(RoundedCornerShape(5.dp))
                            .clickable {
                                setAllSizes(level)
                                allSizeChooser = false
                            }
                            .padding(horizontal = 10.dp, vertical = 10.dp),
                        verticalAlignment = Alignment.CenterVertically,
                    ) {
                        Icon(Icons.Outlined.PhotoSizeSelectLarge, null, Modifier.size(18.dp), tint = theme.text)
                        Spacer(Modifier.width(10.dp))
                        Text(label, color = theme.text, fontSize = 13.sp)
                    }
                }
            }
        }
    }

'''
          if marker not in s:
              raise SystemExit('Dialog insertion marker not found')
          s = s.replace(marker, dialog + marker, 1)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/neversoft/launcher/desktop/Desktop.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Adjust desktop icon sizing controls'
          git push
